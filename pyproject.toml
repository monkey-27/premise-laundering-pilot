[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premise-laundering-pilot"
version = "0.1.0"
description = "Modal-ready pilot for premise laundering in LLM reasoning traces."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0,<3.0.0",
  "huggingface-hub>=0.23.0",
  "modal>=0.64.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
inference = [
  "vllm>=0.5.0",
]
dev = [
  "ruff>=0.4.0",
]

[project.scripts]
pl-pilot = "premise_laundering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
